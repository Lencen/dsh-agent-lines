<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Teams 看板示例</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1017;color:#e6edf3;margin:0;padding:24px}h1{font-size:20px}small{color:#8b949e}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.col{background:#111820;border:1px solid #263241;border-radius:10px;padding:12px}.card{background:#0d141c;border:1px solid #263241;border-radius:8px;padding:10px;margin:10px 0}.tag{font-size:12px;color:#7ee787}.warn{color:#f0b72f}@media(max-width:800px){.cols{grid-template-columns:1fr}}</style></head>
<body><h1>Agent Teams 看板示例（只读）</h1><small>manager 自动读取任务与 line；用户不导出、不配置。</small>
<div class="cols">
<div class="col"><b>待办</b><div class="card"><div>ch027 初稿</div><div class="tag">owner: writer -> line writer</div></div></div>
<div class="col"><b>进行中</b><div class="card"><div>ch028 大纲</div><div class="tag">owner: outliner -> line outliner</div></div></div>
<div class="col"><b>阻塞</b><div class="card"><div>ch029 校对</div><div class="tag warn">blocked_by: task-27</div></div></div>
</div>
<p><small>无 taskRef 的消息只进沟通流；staleOwner 只提示，不自动重派。</small></p>
</body></html>
