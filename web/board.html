<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队 · 团队看板</title>
<link rel="stylesheet" href="/vendor/board-2.0.css">
</head>
<body>
<header class="bd-topbar">
  <div class="bd-brand">dsh-agent-lines · 团队看板<span class="bd-brand-sub" id="bd-team-name">团队</span></div>
  <span class="bd-readonly" title="只读：不提供发消息/审批/交接控件">● 只读</span>
  <span class="bd-datatime">数据 <span id="bd-data-time" class="num">--:--</span></span>
  <span class="bd-version" id="bd-version" title="插件版本">版本 --</span>
  <div class="bd-topbar-spacer"></div>
  <div class="bd-toolbar" role="group" aria-label="全局工具栏">
    <button type="button" class="bd-btn" id="bd-refresh">刷新</button>
    <button type="button" class="bd-btn" id="bd-auto" aria-pressed="false">自动刷新</button>
    <label class="sr-only" for="bd-period">刷新周期</label>
    <select class="bd-select" id="bd-period">
      <option value="10000">10s</option>
      <option value="30000" selected>30s</option>
      <option value="60000">60s</option>
    </select>
    <button type="button" class="bd-btn" id="bd-density" aria-pressed="false">紧凑</button>
  </div>
</header>

<nav class="bd-tabs" role="tablist" aria-label="视图切换">
  <button type="button" class="bd-tab" role="tab" data-view="overview" id="bd-tab-overview" aria-controls="bd-view-overview" aria-selected="true">总览</button>
  <button type="button" class="bd-tab" role="tab" data-view="org" id="bd-tab-org" aria-controls="bd-view-org" aria-selected="false">组织</button>
  <button type="button" class="bd-tab" role="tab" data-view="tasks" id="bd-tab-tasks" aria-controls="bd-view-tasks" aria-selected="false">任务</button>
  <button type="button" class="bd-tab" role="tab" data-view="data" id="bd-tab-data" aria-controls="bd-view-data" aria-selected="false">数据</button>
  <button type="button" class="bd-tab" role="tab" data-view="cost" id="bd-tab-cost" aria-controls="bd-view-cost" aria-selected="false">消耗</button>
</nav>

<div class="bd-contextbar">
  <nav class="bd-breadcrumb" id="bd-breadcrumb" aria-label="面包屑">团队</nav>
  <div class="bd-view-filters" id="bd-context-actions"></div>
</div>

<main class="bd-main">
  <div class="bd-error" id="bd-error" role="alert" hidden></div>

  <section class="bd-view" id="bd-view-overview" data-view="overview" role="tabpanel" aria-labelledby="bd-tab-overview">
    <div class="bd-overview">
      <div class="bd-ov-goalplan">
        <section class="bd-card" id="bd-ov-goal" aria-label="团队目标"><div class="bd-card-h">团队目标</div><div class="bd-card-b" id="bd-ov-goal-body"><p class="bd-empty">加载中…</p></div></section>
        <section class="bd-card" id="bd-ov-plan" aria-label="计划与节奏"><div class="bd-card-h">计划</div><div class="bd-card-b" id="bd-ov-plan-body"><p class="bd-empty">加载中…</p></div></section>
      </div>
      <section class="bd-card bd-ov-wf" id="bd-ov-workflow" aria-label="工作流"><div class="bd-card-h">工作流</div><div class="bd-card-b" id="bd-ov-workflow-body"><p class="bd-empty">加载中…</p></div></section>
      <section class="bd-card bd-ov-rhythm" id="bd-ov-rhythm" aria-label="节奏"><div class="bd-card-h">节奏</div><div class="bd-card-b" id="bd-ov-rhythm-body"><p class="bd-empty">加载中…</p></div></section>
      <section class="bd-card bd-ov-l15" id="bd-ov-l15" aria-label="L1.5 大任务"><div class="bd-card-h">L1.5 大任务</div><div class="bd-card-b" id="bd-ov-l15-body"><p class="bd-empty">加载中…</p></div></section>
    </div>
  </section>

  <section class="bd-view" id="bd-view-org" data-view="org" role="tabpanel" aria-labelledby="bd-tab-org" hidden>
    <div class="bd-card"><div class="bd-card-h">角色与 agent</div><div class="bd-card-b" id="bd-org-body"><p class="bd-empty">加载中…</p></div></div>
  </section>

  <section class="bd-view" id="bd-view-tasks" data-view="tasks" role="tabpanel" aria-labelledby="bd-tab-tasks" hidden>
    <div class="bd-card"><div class="bd-card-h">任务（L1.5 → L2）</div><div class="bd-card-b" id="bd-tasks-body"><p class="bd-empty">加载中…</p></div></div>
  </section>

  <section class="bd-view" id="bd-view-data" data-view="data" role="tabpanel" aria-labelledby="bd-tab-data" hidden>
    <div class="bd-card"><div class="bd-card-h">数据总览</div><div class="bd-card-b" id="bd-data-body"><p class="bd-empty">加载中…</p></div></div>
  </section>

  <section class="bd-view" id="bd-view-cost" data-view="cost" role="tabpanel" aria-labelledby="bd-tab-cost" hidden>
    <div class="bd-card"><div class="bd-card-h">消耗总览</div><div class="bd-card-b" id="bd-cost-body"><p class="bd-empty">加载中…</p></div></div>
  </section>
</main>

<footer class="bd-footer">
  <span>只读视图 · 数据来源：lines.db（线/消息）、团队工作区（TEAM.md/charters/decisions）、team-metrics（token 估算）</span>
  <span class="bd-footer-note">只读 · 不提供发消息/审批/交接控件</span>
</footer>

<!-- 旧抽屉 fallback（新壳保留：独立页不可用时回落；S8 起接入） -->
<aside class="bd-drawer" id="bd-drawer" hidden aria-hidden="true">
  <div class="bd-drawer-head"><b id="drawer-title">详情</b><button type="button" class="bd-btn" id="bd-drawer-close" aria-label="关闭详情">×</button></div>
  <div class="bd-drawer-body" id="drawer-body"></div>
</aside>

<script src="/vendor/board2-core.js"></script>
</body>
</html>
