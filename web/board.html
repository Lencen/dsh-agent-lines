<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>dsh-agent-lines · 团队看板</title>
<style>
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--r:10px;--brand:#0B6E82;--text:#1f2328;--muted:#57606a;--dim:#6e7781;--ok:#237A34;--warn:#8A6300;--bad:#C02626;--bg:#f6f8fa;--panel:#fff;--bd:#e4e7ec;--chip:#f1f3f5}
html[data-theme=dark]{--brand:#22D3EE;--text:#e6edf3;--muted:#9aa4b2;--dim:#8b949e;--ok:#34D399;--warn:#FBBF24;--bad:#F87171;--bg:#0d1117;--panel:#161b22;--bd:#30363d;--chip:#21262d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.topbar{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s5);border-bottom:1px solid var(--bd);background:var(--panel);position:sticky;top:0;z-index:9;flex-wrap:wrap}
.brand{font-weight:600}.badge{font-size:12px;padding:2px var(--s2);border-radius:999px;background:var(--chip);border:1px solid var(--bd);color:var(--muted)}
.crumb{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:var(--s1);margin-left:auto;flex-wrap:wrap}
.tab{font-size:13px;padding:var(--s1) var(--s3);border:1px solid var(--bd);border-radius:999px;background:var(--panel);cursor:pointer;color:var(--muted)}.tab[aria-selected=true]{background:var(--chip);color:var(--text);border-color:var(--brand)}
.wrap{max-width:1680px;margin:0 auto;padding:var(--s5)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s4);align-items:stretch}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s5);min-width:0;height:100%;display:flex;flex-direction:column;gap:0}
.slot-title{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:30px}.slot-title h2{margin:0;font-size:16px}
.slot-status{font-size:12px;padding:1px var(--s2);border-radius:999px;background:var(--chip);border:1px solid var(--bd);color:var(--muted);white-space:nowrap}
.slot-meta{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:20px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--bd);padding-bottom:var(--s2);margin-bottom:var(--s2)}
.slot-body{flex:1;min-height:0;overflow:auto}.slot-actions{min-height:26px;display:flex;align-items:center;gap:var(--s2);border-top:1px solid var(--bd);padding-top:var(--s2);margin-top:var(--s2);flex-wrap:wrap}
.slot-actions button{font-size:12px;padding:3px var(--s2);border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--muted)}
.tree{grid-column:span 3}.main{grid-column:span 6}.side{grid-column:span 3}.full{grid-column:span 12}
@media(max-width:1279px){.tree,.main,.side{grid-column:span 12}}
.tree ul{list-style:none;margin:0;padding-left:var(--s4)}.tree>ul{padding-left:0}.tree li{margin:2px 0}
.node{display:flex;align-items:center;gap:var(--s2);padding:2px var(--s2);border-radius:6px;cursor:pointer}.node:hover{background:var(--chip)}.node[aria-selected=true]{background:var(--chip);box-shadow:inset 2px 0 0 var(--brand)}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node .n{font-size:12px;color:var(--muted)}.lvl{font-size:12px;color:var(--dim)}
.sub,.note{font-size:13px;color:var(--muted)}.empty{border:1px dashed var(--bd);border-radius:var(--r);padding:var(--s6) var(--s4);text-align:center;color:var(--muted)}.empty h3{margin:0 0 var(--s2);font-size:16px;color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:var(--s3);font-size:13px;padding:2px 0}.kv>span:first-child{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--bd)}th{color:var(--muted);font-weight:500}
.pill{font-size:12px;padding:1px var(--s2);border-radius:999px;border:1px solid var(--bd);color:var(--muted);background:var(--chip);white-space:nowrap}.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-bottom:var(--s2)}input,select{font:inherit;font-size:13px;padding:3px var(--s2);border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--text)}input[type=text]{flex:1;min-width:100px}
</style></head>
<body>
<div class="topbar"><span class="brand">dsh-agent-lines · 团队看板</span><span class="badge">0.6.6 · UIUX 验收版</span><span class="badge" id="src">数据：加载中</span><span class="crumb" id="crumb">团队 &gt; 负责人 &gt; 总览</span>
<div class="tabs" role="tablist"><button class="tab" data-view="overview" aria-selected="true">总览</button><button class="tab" data-view="tasks" aria-selected="false">任务</button><button class="tab" data-view="dept" aria-selected="false">部门</button><button class="tab" data-view="metrics" aria-selected="false">数据</button></div></div>
<div class="wrap"><div class="grid">
<section class="card tree" data-level="root"><div class="slot-title"><h2>组织树</h2><span class="slot-status">只读</span></div><div class="slot-meta"><span class="slot-owner">负责人会话 → 角色线 → 官方团队</span><span class="slot-time" id="treeTime">—</span></div><div class="slot-body"><div class="sub">只到三级；成员进右侧详情。</div><ul id="tree"></ul></div><div class="slot-actions"><span class="slot-status">只读</span><span class="note">看板不提供操作</span></div></section>
<section class="card main" data-level="root"><div class="slot-title"><h2 id="mainTitle">总览</h2><span class="slot-status">只读</span></div><div class="slot-meta"><span class="slot-owner" id="mainOwner">负责人</span><span class="slot-time" id="mainTime">—</span></div><div class="slot-body" id="mainBody"><div class="empty"><h3>加载中</h3><p>读取 team-board.json</p></div></div><div class="slot-actions"><span class="slot-status">只读</span><span class="note">看板不提供操作</span></div></section>
<aside class="card side" data-level="root"><div class="slot-title"><h2>详情 / 收件箱</h2><span class="slot-status">只读</span></div><div class="slot-meta"><span class="slot-owner" id="sideOwner">—</span><span class="slot-time" id="sideTime">—</span></div><div class="slot-body" id="sideBody"><div class="empty"><h3>未选择</h3><p>点击组织树中的线</p></div></div><div class="slot-actions"><span class="slot-status">只读</span><span class="note">看板不提供操作</span></div></aside>
<section class="card full" data-level="root"><div class="slot-title"><h2 id="fullTitle">数据</h2><span class="slot-status">只读</span></div><div class="slot-meta"><span class="slot-owner" id="fullOwner">—</span><span class="slot-time" id="fullTime">—</span></div><div class="slot-body" id="fullBody"></div><div class="slot-actions"><span class="slot-status">只读</span><span class="note">看板不提供操作</span></div></section>
</div></div>
<script>
const $=id=>document.getElementById(id)
const S={board:null,metrics:null,lines:[],line:null,dept:null,view:'overview',expanded:{},busy:false,error:null}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const val=(v,d='—')=>v===null||v===undefined||v===''?d:v
const pill=(s,cls='')=>'<span class="pill '+cls+'">'+esc(val(s))+'</span>'
const empty=(h,p)=>'<div class="empty"><h3>'+esc(h)+'</h3><p>'+esc(p)+'</p></div>'
const get=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.json()}
const count=t=>{const s={total:0,done:0,inProgress:0,blocked:0};(t||[]).forEach(x=>{s.total++;if(x.status==='completed')s.done++;else if(x.status==='in_progress')s.inProgress++;if(x.status==='pending'&&Array.isArray(x.blockedBy)&&x.blockedBy.length)s.blocked++});return s}
const nodeSum=l=>l?.deptSummary||{total:0,done:0,inProgress:0,blocked:0,stale:0}
async function load(){
  S.busy=true;S.error=null;draw()
  try{
    S.board=await get('/api/team-board');S.lines=Array.isArray(S.board.lines)?S.board.lines:[]
    S.line=S.line||S.board?.manager?.line||S.lines[0]?.label||'manager'
    try{S.dept=await get('/api/team-board/'+encodeURIComponent(S.line))}catch{S.dept=null}
    try{S.metrics=await get('/api/team-metrics')}catch{S.metrics=null}
  }catch(e){S.error=String(e.message||e)}finally{S.busy=false;draw()}
}
function tree(){
  const root=S.board?.manager?.line||'manager';const rc=count(S.board?.tasks)
  let h='<li><div class="node" data-id="'+esc(root)+'" aria-selected="'+String(S.line===root)+'"><span>▾</span><span class="nm">'+esc(root)+'</span><span class="lvl">负责人</span><span class="n">'+rc.total+'</span></div><ul>'
  S.lines.filter(l=>l.label!==root).forEach(l=>{const c=nodeSum(l);const open=S.expanded[l.label]!==false;h+='<li><div class="node" data-id="'+esc(l.label)+'" aria-selected="'+String(S.line===l.label)+'"><span data-toggle="'+esc(l.label)+'">'+(l.officialTeamAvailable?(open?'▾':'▸'):'·')+'</span><span class="nm">'+esc(l.label)+'</span><span class="lvl">角色线</span><span class="n">'+val(c.total,0)+'</span></div>';if(l.officialTeamAvailable&&open)h+='<ul><li><div class="node" data-id="'+esc(l.label)+'" aria-selected="'+String(S.line===l.label)+'"><span>·</span><span class="nm">'+esc(l.label)+' 官方团队</span><span class="lvl">团队</span><span class="n">'+val(c.total,0)+'</span></div></li></ul>';h+='</li>'})
  $('tree').innerHTML=h+'</ul></li>'
  $('tree').querySelectorAll('[data-toggle]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const id=e.dataset.toggle;S.expanded[id]=S.expanded[id]===false;tree()})
  $('tree').querySelectorAll('.node').forEach(e=>e.onclick=async()=>{S.line=e.dataset.id;try{S.dept=await get('/api/team-board/'+encodeURIComponent(S.line))}catch{S.dept=null}draw()})
  $('treeTime').textContent=S.board?.generatedAt?new Date(S.board.generatedAt).toLocaleString():'—'
}
function overview(){
  const c=count(S.board?.tasks);let h='<div class="row">'+pill('任务 '+c.total)+pill('完成 '+c.done,'ok')+pill('进行 '+c.inProgress,'warn')+pill('阻塞 '+c.blocked,'bad')+'</div>'
  h+='<h3 style="font-size:14px;margin:12px 0 6px">各线摘要（分别计数，不合并任务板）</h3><table><thead><tr><th>线</th><th>任务</th><th>完成</th><th>进行</th><th>阻塞</th><th>官方团队</th></tr></thead><tbody>'
  S.lines.forEach(l=>{const d=nodeSum(l);h+='<tr><td>'+esc(l.label)+'</td><td>'+val(d.total,0)+'</td><td>'+val(d.done,0)+'</td><td>'+val(d.inProgress,0)+'</td><td>'+val(d.blocked,0)+'</td><td>'+(l.officialTeamAvailable?'是':'否')+'</td></tr>'})
  $('mainBody').innerHTML=h+'</tbody></table>'
}
function tasks(){
  const rows=S.line===(S.board?.manager?.line||'manager')?(S.board?.tasks||[]):(S.dept?.tasks||[])
  if(!rows.length){$('mainBody').innerHTML=empty('暂无任务','该层没有返回任务；deleted 不返回。');return}
  let h='<table><thead><tr><th>任务</th><th>状态</th><th>负责人</th><th>parent</th></tr></thead><tbody>'
  rows.forEach(t=>h+='<tr><td>'+esc(t.subject||t.id)+'</td><td>'+pill(t.status)+(t.staleOwner?pill('stale','bad'):'')+'</td><td>'+esc(val(t.ownerName||t.ownerLine))+'</td><td>'+esc(val(t.parentTaskId))+'</td></tr>')
  $('mainBody').innerHTML=h+'</tbody></table>'
}
function dept(){
  if(!S.dept){$('mainBody').innerHTML=empty('该线未接官方团队','没有部门快照。');return}
  const m=S.dept.officialTeam?.members||[],t=S.dept.tasks||[],a=S.dept.subteamAudit
  let h='<div class="row">'+pill('成员 '+m.length)+pill('任务 '+t.length)+(a?pill('overLimit '+a.overLimit,a.overLimit?'bad':'ok'):'')+'</div>'
  h+='<h3 style="font-size:14px;margin:12px 0 6px">成员</h3>'+(m.length?'<div class="row">'+m.map(x=>pill(x.name+' · '+x.role)).join('')+'</div>':empty('暂无成员','该线没有官方团队成员。'))
  h+='<h3 style="font-size:14px;margin:12px 0 6px">任务</h3>'+(t.length?'<table><thead><tr><th>任务</th><th>状态</th><th>parent</th><th>策略</th></tr></thead><tbody>'+t.map(x=>'<tr><td>'+esc(x.subject||x.id)+'</td><td>'+pill(x.status)+'</td><td>'+esc(val(x.parentTaskId))+'</td><td>'+esc(val(x.subteamPolicy))+'</td></tr>').join('')+'</tbody></table>':empty('暂无部门任务','该线没有官方团队任务。'))
  $('mainBody').innerHTML=h
}
function metrics(){
  const m=S.metrics;if(!m){$('mainBody').innerHTML=empty('暂无数据快照','调用 line_metrics 生成 team-metrics.json。');return}
  const b=m.tasks?.byLine||[],ls=m.lines||[]
  let h='<div class="row">'+pill('任务 '+val(m.tasks?.manager?.total,0))+pill('线 '+val(m.sessions?.lines,0))+pill('成员 '+val(m.sessions?.officialMembers,0))+pill('消息 '+val(m.messages?.total,0))+pill('token '+val(m.tokens?.total,0))+'</div>'
  h+='<table><thead><tr><th>线</th><th>任务</th><th>完成</th><th>进行</th><th>阻塞</th><th>token</th></tr></thead><tbody>'+b.map(x=>{const l=ls.find(y=>y.label===x.line);return '<tr><td>'+esc(x.line)+'</td><td>'+val(x.total,0)+'</td><td>'+val(x.done,0)+'</td><td>'+val(x.inProgress,0)+'</td><td>'+val(x.blocked,0)+'</td><td>'+val(l?.activity?.decodeTokens,0)+'</td></tr>'}).join('')+'</tbody></table><div class="note" style="margin-top:12px">'+esc((m.limitations||[]).join('；'))+'</div>'
  $('mainBody').innerHTML=h
}
function side(){
  const l=S.lines.find(x=>x.label===S.line);if(!l){$('sideBody').innerHTML=empty('未选择','点击组织树中的线。');return}
  const d=nodeSum(l),m=S.dept?.officialTeam?.members||[]
  let h='<div class="kv"><span>线</span><span>'+esc(l.label)+'</span></div><div class="kv"><span>状态</span><span>'+esc(val(l.status))+' · gen '+esc(val(l.generation))+'</span></div><div class="kv"><span>官方团队</span><span>'+(l.officialTeamAvailable?'是':'否')+'</span></div><div class="kv"><span>任务</span><span>'+val(d.total,0)+'</span></div><div class="kv"><span>策略</span><span>'+esc(val(l.subteamPolicy))+' / '+esc(val(l.maxMembers))+'</span></div><div class="kv"><span>subteamAudit</span><span>'+esc(val(S.dept?.subteamAudit?.overLimit))+'</span></div>'
  h+='<h3 style="font-size:14px;margin:12px 0 6px">成员</h3>'+(m.length?'<div class="row">'+m.map(x=>pill(x.name)).join('')+'</div>':empty('无成员','该线没有官方团队成员。'))
  $('sideBody').innerHTML=h
}
function full(){
  const m=S.metrics
  if(!m){$('fullBody').innerHTML=empty('暂无数据','调用 line_metrics 生成 team-metrics.json。');return}
  const b=m.tasks?.byLine||[],ls=m.lines||[]
  let h='<div class="row">'+pill('任务 '+val(m.tasks?.manager?.total,0))+pill('线 '+val(m.sessions?.lines,0))+pill('成员 '+val(m.sessions?.officialMembers,0))+pill('消息 '+val(m.messages?.total,0))+pill('token '+val(m.tokens?.total,0))+'</div>'
  h+='<table><thead><tr><th>线</th><th>任务</th><th>完成</th><th>进行</th><th>阻塞</th><th>token</th></tr></thead><tbody>'+b.map(x=>{const l=ls.find(y=>y.label===x.line);return '<tr><td>'+esc(x.line)+'</td><td>'+val(x.total,0)+'</td><td>'+val(x.done,0)+'</td><td>'+val(x.inProgress,0)+'</td><td>'+val(x.blocked,0)+'</td><td>'+val(l?.activity?.decodeTokens,0)+'</td></tr>'}).join('')+'</tbody></table><div class="note" style="margin-top:12px">'+esc((m.limitations||[]).join('；'))+'</div>'
  $('fullBody').innerHTML=h
}
function draw(){
  $('src').textContent=S.error?'数据：错误':(S.busy?'数据：加载中':'数据：快照')
  $('mainTime').textContent=S.board?.generatedAt?new Date(S.board.generatedAt).toLocaleString():'—';$('sideTime').textContent=$('mainTime').textContent;$('fullTime').textContent=$('mainTime').textContent
  $('mainOwner').textContent=S.line||'负责人';$('sideOwner').textContent=S.line||'—';$('fullOwner').textContent=S.line||'—'
  const labels={overview:'总览',tasks:'任务',dept:'部门',metrics:'数据'}
  $('mainTitle').textContent=labels[S.view]+' · '+(S.line||'负责人');$('fullTitle').textContent='数据';$('crumb').textContent='团队 > '+(S.line||'负责人')+' > '+labels[S.view]
  if(S.error){$('tree').innerHTML='';$('mainBody').innerHTML=empty('读取失败',S.error);$('sideBody').innerHTML='';$('fullBody').innerHTML='';return}
  tree();side()
  if(S.view==='overview')overview();else if(S.view==='tasks')tasks();else if(S.view==='dept')dept();else metrics()
  full()
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.view=t.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===t)));draw()})
load()
</script></body></html>
