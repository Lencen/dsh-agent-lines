name: 集成报告 / Integration report
description: 在真实 DSH 环境里跑通/跑不通的记录
title: "[Integration]: "
labels: ["integration"]
body:
  - type: input
    id: versions
    attributes:
      label: 版本
      placeholder: "DSH 0.2.1-rc.5 / dsh-agent-lines 0.3.0 / Node 22.23.2"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台
      placeholder: "Ubuntu 24.04 / local disk / profile demo"
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: 安装方式
      description: npm / tarball / 本地目录；profile 名可脱敏
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: 冒烟结果
      placeholder: |
        line_status:
        line_claim_manager:
        line_create:
        line_list:
        line_send / line_inbox / line_ack:
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 备注/失败点
      description: 请脱敏，不要放 token、真实 Session、客户数据
